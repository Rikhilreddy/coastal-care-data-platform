version: 2

sources:
  - name: bronze
    description: Raw source data, loaded unchanged by ingestion/legacy/load_bronze_desynpuf.py
    schema: bronze
    tables:
      - name: desynpuf_beneficiary
        description: CMS DE-SynPUF beneficiary summary, one row per member per year (_file_year)
      - name: desynpuf_inpatient
        description: CMS DE-SynPUF inpatient claims, one row per claim segment
      - name: desynpuf_outpatient
        description: CMS DE-SynPUF outpatient claims, one row per claim segment
      - name: hl7_segment
        description: Inbound HL7 v2 messages, one row per segment as received, loaded by hl7/load_bronze_hl7.py
      - name: x12_segment
        description: Inbound X12 files, one row per segment exactly as received, loaded by edi/load_bronze_x12.py
      - name: fhir_resource
        description: Synthea FHIR R4 resources, one row per resource as JSONB, loaded by ingestion/fhir/load_bronze_fhir.py
  - name: ref
    description: Code sets and conversion outputs, loaded by ingestion/reference and sql/conversion
    schema: ref
    tables:
      - name: icd9_dx_conversion
      - name: icd10cm
      - name: hcpcs
  - name: audit
    description: Control and test tables written by the pipelines
    schema: audit
    tables:
      - name: mpi_test_truth
        description: Answer key for MPI evaluation (seeded test-data noise); never used for matching
