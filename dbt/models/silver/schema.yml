version: 2

models:
  - name: member_year
    description: One row per member per coverage year (geography, coverage months, chronic conditions, reported reimbursement)
    data_tests:
      - unique:
          arguments:
            column_name: "member_source_id || '-' || coverage_year"
    columns:
      - name: member_source_id
        data_tests: [not_null]
      - name: coverage_year
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2008, 2009, 2010]
                quote: false
      - name: esrd_flag
        data_tests: [not_null]
      - name: has_diabetes
        data_tests: [not_null]
      - name: has_chf
        data_tests: [not_null]

  - name: member
    description: One row per member per source system (stable demographics). race_code is RESTRICTED (masked for analyst roles).
    data_tests:
      - unique:
          arguments:
            column_name: "source_system || '-' || member_source_id"
    columns:
      - name: source_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['DESYNPUF', 'SYNTHEA_FHIR']
      - name: member_source_id
        data_tests: [not_null]
      - name: birth_date
        data_tests: [not_null]
      - name: sex_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['M', 'F']
      - name: race_code
        meta:
          pii: restricted
        data_tests:
          - accepted_values:
              arguments:
                values: ['WHITE', 'BLACK', 'OTHER', 'HISPANIC', 'UNKNOWN']   # UNKNOWN: race is optional in US Core

  - name: claim_header
    description: One row per claim from every source (DE-SynPUF segments rolled up; FHIR Claim + EOB).
    data_tests:
      - unique:
          arguments:
            column_name: "source_system || '-' || claim_id"
    columns:
      - name: claim_id
        data_tests: [not_null]
      - name: claim_type
        description: Canonical across sources. IP/OP facility, PROF professional, RX pharmacy
        data_tests:
          - accepted_values:
              arguments:
                values: ['IP', 'OP', 'PROF', 'RX']
      - name: payer_name
        data_tests: [not_null]
      - name: member_source_id
        data_tests: [not_null]
      - name: claim_from_date
        data_tests: [not_null]
      - name: claim_thru_date
        data_tests: [not_null]
      - name: claim_year
        data_tests:
          - accepted_values:
              arguments:
                values: [2008, 2009, 2010]
                quote: false
              config:
                where: "source_system = 'DESYNPUF'"
          - not_null
      - name: paid_amount
        data_tests: [not_null]
      - name: segment_count
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false

  - name: claim_diagnosis
    description: One row per diagnosis on a claim (all sources) with its ICD-10-CM conversion.
    data_tests:
      - unique:
          arguments:
            column_name: "source_system || '-' || claim_id || '-' || segment || '-' || dx_position"
    columns:
      - name: claim_id
        data_tests:
          - relationships:
              arguments:
                to: ref('claim_header')
                field: claim_id
      - name: dx_role
        data_tests:
          - accepted_values:
              arguments:
                values: ['ADMITTING', 'PRINCIPAL', 'SECONDARY']
      - name: source_code_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['ICD9CM', 'SNOMEDCT']
      - name: source_code
        data_tests: [not_null]
      - name: conversion_method
        description: How icd10_code was decided. NULL would mean the code never reached the conversion logic.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EXACT', 'APPROXIMATE', 'APPROXIMATE_MULTI', 'COMBINATION', 'PARENT_FALLBACK',
                         'NO_MAP', 'NOT_IN_GEM',
                         'CROSSWALK', 'NOT_CODABLE', 'PENDING_REVIEW', 'REJECTED', 'NOT_IN_CROSSWALK']

  - name: claim_procedure
    description: One row per valid procedure code (ICD-9-CM procedure or HCPCS/CPT) on a claim.
    data_tests:
      - unique:
          arguments:
            column_name: "claim_id || '-' || segment || '-' || code_system || '-' || position"
    columns:
      - name: claim_id
        data_tests:
          - relationships:
              arguments:
                to: ref('claim_header')
                field: claim_id
      - name: code_system
        data_tests:
          - accepted_values:
              arguments:
                values: ['ICD9-PROC', 'HCPCS']

  - name: member_identity
    description: RESTRICTED direct identifiers (name, SSN, MRN, address, phone). Not for analyst roles.
    meta:
      pii: restricted
    data_tests:
      - unique:
          arguments:
            column_name: "source_system || '-' || member_source_id"
